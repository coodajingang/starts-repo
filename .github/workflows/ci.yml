# CloudPlayer CI/CD
# 编译、测试、打包 — Swift Package Manager 项目

name: CloudPlayer CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        type: choice
        options:
          - Debug
          - Release
        default: Debug

env:
  DEVELOPER_DIR: /Applications/Xcode_15.2.app/Contents/Developer

jobs:
  # ========================================
  # 代码质量检查
  # ========================================
  lint:
    name: Lint and Format Check
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Swift Lint (Check Only)
        run: swift format lint --recursive Sources/ Tests/ 2>&1 || true

  # ========================================
  # macOS 编译（原生 swift build）
  # ========================================
  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build macOS
        run: |
          swift build \
            -c ${{ github.event.inputs.build_configuration || 'debug' }} \
            --product CloudPlayer

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-log
          path: .build/

  # ========================================
  # iOS 编译（xcodebuild + SPM）
  # ========================================
  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build iOS
        run: |
          xcodebuild build \
            -scheme CloudPlayer \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2" \
            -configuration ${{ github.event.inputs.build_configuration || 'Debug' }} \
            CODE_SIGNING_ALLOWED=NO

  # ========================================
  # tvOS 编译
  # ========================================
  build-tvos:
    name: Build tvOS
    runs-on: macos-14
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build tvOS
        run: |
          xcodebuild build \
            -scheme CloudPlayer \
            -sdk appletvsimulator \
            -destination "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=17.2" \
            -configuration ${{ github.event.inputs.build_configuration || 'Debug' }} \
            CODE_SIGNING_ALLOWED=NO

  # ========================================
  # 单元测试
  # ========================================
  test:
    name: Unit Tests
    runs-on: macos-14
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Run Tests
        run: |
          swift test \
            -c debug \
            --parallel \
            --xunit-output Tests/results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Tests/results.xml

  # ========================================
  # 全平台编译验证
  # ========================================
  build-all:
    name: Build All Platforms
    runs-on: macos-14
    needs: [build-ios, build-macos, build-tvos, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Build Release (macOS)
        run: |
          swift build \
            -c release \
            --product CloudPlayer

      - name: Build Release (iOS)
        run: |
          xcodebuild build \
            -scheme CloudPlayer \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release (tvOS)
        run: |
          xcodebuild build \
            -scheme CloudPlayer \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Release Summary
        run: |
          echo "## ✅ All platforms build successfully" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- tvOS: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- visionOS: ✅ (requires Xcode 15.2+)" >> $GITHUB_STEP_SUMMARY